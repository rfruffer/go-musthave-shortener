version: '3.8'

services:
  shortener-grpc:
    build:
      context: .
      dockerfile: Dockerfile.grpc
    ports:
      - "8080:8080"   # HTTP порт
      - "3200:3200"   # gRPC порт
    environment:
      - SERVER_ADDRESS=0.0.0.0:8080
      - GRPC_ADDRESS=0.0.0.0:3200
      - BASE_URL=http://localhost:8080
      - DATABASE_DSN=postgres://postgres:postgres@postgres:5432/shortener?sslmode=disable
    depends_on:
      - postgres
    networks:
      - shortener-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=shortener
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shortener-network

networks:
  shortener-network:
    driver: bridge

volumes:
  postgres_data: