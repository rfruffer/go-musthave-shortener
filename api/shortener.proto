syntax = "proto3";

package shortener;

option go_package = "github.com/rfruffer/go-musthave-shortener/internal/grpc";

// URLShortenerService предоставляет методы для работы с сокращенными URL через gRPC
service URLShortenerService {
  // CreateShortURL создает короткую ссылку из обычного URL
  rpc CreateShortURL(CreateShortURLRequest) returns (CreateShortURLResponse);
  
  // CreateShortJSONURL создает короткую ссылку в формате JSON
  rpc CreateShortJSONURL(CreateShortJSONURLRequest) returns (CreateShortJSONURLResponse);
  
  // GetShortURL получает оригинальный URL по короткому ID
  rpc GetShortURL(GetShortURLRequest) returns (GetShortURLResponse);
  
  // Ping проверяет подключение к базе данных
  rpc Ping(PingRequest) returns (PingResponse);
  
  // Batch создает несколько коротких ссылок за один запрос
  rpc Batch(BatchRequest) returns (BatchResponse);
  
  // GetUserURLs получает все URL пользователя
  rpc GetUserURLs(GetUserURLsRequest) returns (GetUserURLsResponse);
  
  // BatchDelete удаляет несколько URL пользователя
  rpc BatchDelete(BatchDeleteRequest) returns (BatchDeleteResponse);
  
  // GetStats получает статистику сервиса
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}

// Запрос для создания короткой ссылки
message CreateShortURLRequest {
  string url = 1;
  string user_id = 2;
}

// Ответ для создания короткой ссылки
message CreateShortURLResponse {
  string short_url = 1;
  bool already_exists = 2;
}

// Запрос для создания короткой ссылки в JSON формате
message CreateShortJSONURLRequest {
  string url = 1;
  string user_id = 2;
}

// Ответ для создания короткой ссылки в JSON формате
message CreateShortJSONURLResponse {
  string result = 1;
  bool already_exists = 2;
}

// Запрос для получения оригинального URL
message GetShortURLRequest {
  string id = 1;
}

// Ответ для получения оригинального URL
message GetShortURLResponse {
  string original_url = 1;
  bool deleted = 2;
}

// Запрос для проверки подключения
message PingRequest {}

// Ответ для проверки подключения
message PingResponse {
  bool success = 1;
}

// Элемент пакетного запроса
message BatchOriginalURL {
  string correlation_id = 1;
  string original_url = 2;
}

// Элемент пакетного ответа
message BatchShortURL {
  string correlation_id = 1;
  string short_url = 2;
}

// Запрос для пакетного создания
message BatchRequest {
  repeated BatchOriginalURL urls = 1;
  string user_id = 2;
}

// Ответ для пакетного создания
message BatchResponse {
  repeated BatchShortURL urls = 1;
}

// Запрос для получения URL пользователя
message GetUserURLsRequest {
  string user_id = 1;
}

// URL пользователя
message URLEntry {
  string short_url = 1;
  string original_url = 2;
}

// Ответ для получения URL пользователя
message GetUserURLsResponse {
  repeated URLEntry urls = 1;
}

// Запрос для пакетного удаления
message BatchDeleteRequest {
  repeated string ids = 1;
  string user_id = 2;
}

// Ответ для пакетного удаления
message BatchDeleteResponse {
  bool success = 1;
}

// Запрос для получения статистики
message GetStatsRequest {}

// Ответ для получения статистики
message GetStatsResponse {
  int32 urls = 1;
  int32 users = 2;
}